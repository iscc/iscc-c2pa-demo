<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
     xmlns:dc="http://purl.org/dc/elements/1.1/"
     xmlns:cc="http://creativecommons.org/ns#"
     width="80mm" height="60mm" viewBox="0 0 80 60">
  <desc>Overlapping shapes with a gradient and transparency</desc>
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>ISCC SVG test image</dc:title>
        <dc:creator><rdf:Bag><rdf:li>ISCC Foundation</rdf:li></rdf:Bag></dc:creator>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0054b2"/>
      <stop offset="1" stop-color="#7ac2ff"/>
    </linearGradient>
  </defs>
  <rect x="4" y="4" width="48" height="36" rx="3" fill="url(#sky)"/>
  <circle cx="52" cy="38" r="18" fill="#ff5f4d" fill-opacity="0.8"/>
  <path d="M10 54 L30 44 L50 54 L70 44" fill="none" stroke="#1b2437" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="62,6 76,20 62,20" fill="#c7f06b"/>
</svg>
