[package]
name = "iscc-c2pa-demo"
version = "0.3.0"
description = "Desktop demo: inspect and sign C2PA manifests with ISCC soft bindings"
license = "Apache-2.0"
authors = ["ISCC Foundation <info@iscc.io>"]
repository = "https://github.com/iscc/iscc-c2pa-demo"
homepage = "https://c2pa-demo.iscc.codes"
# Two binaries: the app and the c2pa-iscc CLI (feature `cli`); `cargo run` and `tauri dev` start
# the app. The version here is the release version (tauri.conf.json has none, package.json is
# private).
default-run = "iscc-c2pa-demo"
edition = "2021"
rust-version = "1.96"

[lib]
name = "iscc_c2pa_demo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Pinned: the unstable_* text handlers may change between c2pa releases.
c2pa = { version = "=0.91.1", default-features = false, features = [
  "rust_native_crypto",
  "file_io",
  "unstable_plain_text",
  "unstable_structured_text",
  "pdf",
] }
iscc-lib = "0.6"
image = "0.25"
kamadak-exif = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive"], optional = true }
rbook = { version = "0.7", default-features = false }
quick-xml = "0.42.0"
# The version resvg_py 0.5.0 uses, so SVGs rasterise like in iscc-sdk.
resvg = "0.48"
# Same version and features as the copy rbook and c2pa already pull in.
zip = { version = "8.6", default-features = false, features = [
  "deflate-flate2-zlib-rs",
] }
html-escape = "0.2.15"
# Timestamp requests only; the same version and features as c2pa's optional `http_ureq`, which
# stays off so c2pa itself never goes online.
ureq = { version = "3.3", default-features = false, features = ["rustls"] }
# Audio: demuxing and decoding of the formats c2pa-rs can sign (MP3, FLAC, WAV, M4A with AAC or
# ALAC; the ID3 and APE readers let symphonia skip tags), Chromaprint (bit-exact with fpcalc's
# TEST2 algorithm) and tags with cover art. rusty-opus decodes Opus tracks of MP4 containers,
# which symphonia reads but cannot decode (src/opus.rs registers it as a symphonia decoder).
symphonia = { version = "0.6.1", default-features = false, features = [
  "opt-simd",
  "all-meta",
  "mp3",
  "flac",
  "pcm",
  "wav",
  "aac",
  "alac",
  "isomp4",
] }
rusty-chromaprint = "0.3.0"
rusty-opus = "0.9.1"
lofty = "0.25.4"
# PDF text and rendering through the pdfium library bundled with the app (scripts/fetch_pdfium.py
# pins the build), bound at run time, so a missing library is an inspection error. Only the raw C
# API is used. `pdfium_7881` is the newest API set that binds bblanchon's build (`pdfium_future`
# expects XFA, V8 and Skia symbols); pdf.rs serialises all calls itself.
pdfium-render = { version = "0.9.4", default-features = false, features = [
  "pdfium_7881",
] }
# PDF metadata (docinfo and XMP); the version and features c2pa's `pdf` feature pulls in.
lopdf = "0.45.0"
# Video: ffmpeg installed on first use into the local data folder (tools.rs), its archive checked
# with BLAKE3 like iscc-sdk does, signatures written to a temporary folder. All three are in the
# tree already (c2pa, Tauri).
blake3 = "1.8"
dirs = "6"
tempfile = "3"
# Semantic-Codes: the iscc-sci and iscc-sct models (downloaded on first use, tools.rs) run in rten,
# pure Rust and bit-exact with onnxruntime. The tokenizer and the chunking are those iscc-sct
# uses; text-splitter moves in lockstep with the semantic-text-splitter version iscc-sct resolves,
# because a splitter release can move chunk boundaries. tokenizers without its default features
# needs no C library (no Oniguruma; text-splitter's `tokenizers` feature would force it, so
# semantic/text.rs sizes chunks itself), and 0.23 honours the truncation tokenizer.json declares.
rten = "=0.27.0"
rten-tensor = "=0.27.0"
tokenizers = { version = "=0.23.2", default-features = false, features = [
  "unstable_wasm",
] }
text-splitter = "=0.33.0"

[features]
# The c2pa-iscc command-line tool. Off by default, because `tauri build` puts every binary whose
# required features are enabled into the app bundles, and the CLI is not released yet.
cli = ["dep:clap"]

[[bin]]
name = "c2pa-iscc"
path = "src/bin/c2pa-iscc.rs"
required-features = ["cli"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["cli"]

[lints.clippy]
# Threshold in clippy.toml; the lint is off by default (nursery).
cognitive_complexity = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# rten's kernels run at half speed when optimised for size; the rest of the app stays small.
[profile.release.package.rten]
opt-level = 3
[profile.release.package.rten-base]
opt-level = 3
[profile.release.package.rten-gemm]
opt-level = 3
[profile.release.package.rten-parallel]
opt-level = 3
[profile.release.package.rten-simd]
opt-level = 3
[profile.release.package.rten-tensor]
opt-level = 3
[profile.release.package.rten-vecmath]
opt-level = 3

# Image decoding and hashing are far too slow unoptimized; keep dependencies fast in dev builds.
# Their debug assertions and overflow checks made the Semantic-Code Text 1.7 to 2.6 times slower.
[profile.dev.package."*"]
opt-level = 3
debug-assertions = false
overflow-checks = false
