# Quality gates on every push to main and every pull request: the pre-commit hooks, clippy and
# tsc on Linux, the Rust tests on Windows, macOS and Linux (with ffmpeg for the video tests).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # No debug info: the dev profile builds every dependency at opt-level 3, and with debug info a
  # cold build on the Windows runner takes over an hour.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds ../dist, so the frontend must exist before cargo runs.
      - run: pnpm build
      - name: Pre-commit hooks (formatting, file hygiene)
        run: uv run prek run --all-files --stage pre-commit --show-diff-on-failure
      # tauri.conf.json bundles src-tauri/pdfium/*, and the build script fails when it is empty.
      - run: uv run scripts/fetch_pdfium.py
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v10.2.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: uv run scripts/fetch_pdfium.py
      # The video tests run the ffmpeg the app installs on first use (tools.rs) and install it
      # when it is missing; keep it between runs instead of downloading 26 to 73 MB each time.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/codes.iscc.c2pa-demo/tools
            ~/Library/Application Support/codes.iscc.c2pa-demo/tools
            ~/AppData/Local/codes.iscc.c2pa-demo/tools
          key: ffmpeg-8.1-${{ runner.os }}
      # The macOS build of ffmpeg is x86_64; the arm64 runners need Rosetta 2 to run it.
      - name: Install Rosetta 2
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: softwareupdate --install-rosetta --agree-to-license
      - run: cargo test --manifest-path src-tauri/Cargo.toml --tests --all-features
